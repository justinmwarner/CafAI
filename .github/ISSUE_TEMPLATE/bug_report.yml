name: Bug report
description: Something in CafAI does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Never paste your Anthropic API key, the bridge's pairing code or anything else secret here. A security problem goes through the **Security** tab instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what CafAI did instead. The words on screen help, as does a screenshot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. New bag, Blooming Espresso
        2. Pull a shot
        3. Tap "Sour / sharp"
  - type: input
    id: cafai-version
    attributes:
      label: CafAI version
      description: Settings > About, the line "CafAI 0.1.0".
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: decaid-version
    attributes:
      label: Decaid version
      description: Settings > About, the line "Decaid 0.8.8+2900 (CafAI was verified with 0.8.8)"; or Decaid's own settings when CafAI does not start.
      placeholder: 0.8.8+2900
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Where CafAI runs
      options:
        - A Decent tablet, inside Decaid
        - Another tablet or computer, inside Decaid
        - A phone's browser (http://<tablet-ip>:3000)
        - A computer's browser
        - Mock mode or the demo (npm run dev:mock, npm run demo)
    validations:
      required: true
  - type: input
    id: device-model
    attributes:
      label: Device and screen size
      description: The tablet or phone model and its screen size, and the browser for a phone or computer.
      placeholder: Teclast P80X, 1280x800 / iPhone 15, Safari
    validations:
      required: true
  - type: dropdown
    id: coach
    attributes:
      label: Where the coach runs
      description: Settings > Where the coach runs.
      options:
        - Anthropic API key
        - Claude on my computer (CafAI Bridge)
        - The problem is not about the coach
  - type: input
    id: machine
    attributes:
      label: Machine, scale and grinder
      placeholder: DE1Pro, Decent Scale, Niche Zero
  - type: textarea
    id: drift-report
    attributes:
      label: The report from Settings > About
      description: When Settings > About says "Decaid sent N things CafAI did not expect", tap **Copy report** and paste it here. It holds Decaid's routes and field names, never your notes or the key.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: For CafAI Bridge, the output of `npm run bridge -- status` (it never shows the code).
