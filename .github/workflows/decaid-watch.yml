name: Decaid drift watch

# Would the newest Decaid break CafAI? Checks Decaid's latest release and its
# main branch against the pinned specs (contract/decaid, spec 4.3).
#
# Two jobs, so the one that installs dependencies holds no write token: `watch`
# runs the check with read access only and uploads the report; `issue`
# downloads it and files it by the watch's exit code:
#   1  a check failed: an issue labelled decaid-drift, or a comment on the
#      open one; the run fails.
#   2  the watch could not look at everything (GitHub could not serve a
#      version, or list the files changed since the pin): an issue labelled
#      decaid-watch-blind, or a comment on the open one, and a warning.
#   4  files CafAI depends on changed and every check passes: a low-priority
#      issue labelled decaid-read, or the open one's body replaced by the
#      latest report (an edit, not a comment, so no daily notification).
#   0  nothing CafAI depends on changed: no issue.
#   3  the watch itself broke: the run fails, no issue.

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      code: ${{ steps.watch.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the latest Decaid against the pin
        id: watch
        env:
          # Read-only here; it only raises GitHub's API rate limit.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          npm run decaid:watch -- --report report.md --issue issue.md
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # The full report, also when an issue only holds its start.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decaid-drift-report
          path: |
            report.md
            issue.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Warn when the watch could not look at everything
        if: steps.watch.outputs.code == '2'
        run: echo "::warning::The Decaid drift watch could not look at every Decaid version or its changed files; see the issue labelled decaid-watch-blind."

      - name: Fail the run when a check failed or the watch broke
        if: steps.watch.outputs.code != '0' && steps.watch.outputs.code != '2' && steps.watch.outputs.code != '4'
        run: exit 1

  issue:
    needs: watch
    if: ${{ !cancelled() && (needs.watch.outputs.code == '1' || needs.watch.outputs.code == '2' || needs.watch.outputs.code == '4') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      CODE: ${{ needs.watch.outputs.code }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: decaid-drift-report

      - name: Open or update the issue for this outcome
        run: |
          case "$CODE" in
            1)
              label=decaid-drift color=B60205 update=comment
              description="A newer Decaid fails CafAI's contract checks"
              title="Decaid changed something CafAI reads" ;;
            2)
              label=decaid-watch-blind color=FBCA04 update=comment
              description="The Decaid drift watch could not look at every Decaid version"
              title="The Decaid drift watch could not look" ;;
            4)
              label=decaid-read color=E4E9F2 update=edit
              description="Decaid changed files CafAI depends on; every check passes"
              title="Decaid changed files CafAI depends on" ;;
          esac
          gh label create "$label" --color "$color" --description "$description" 2>/dev/null || true
          number=$(gh issue list --label "$label" --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh issue create --label "$label" --title "$title" --body-file issue.md
          elif [ "$update" = edit ]; then
            gh issue edit "$number" --body-file issue.md
          else
            gh issue comment "$number" --body-file issue.md
          fi
