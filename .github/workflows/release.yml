name: Release

# Every version tag (v1.2.3) pushed on a commit of main is a release: it
# builds the installable skin zip, with index.html and the skin manifest at
# the zip root, and attaches it to a GitHub Release that Decaid installs from
# (Skins -> + -> GitHub Release) and updates to (Decaid checks every 12 h and
# keys updates on the tag). `npm version patch && git push --follow-tags`
# makes one. Nothing is built or published until CafAI has passed against
# the latest Decaid release (decaid-live) and its own e2e suite (spec 4.7).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    # Releases come from main only, and the tag names package.json's version.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag is on main and matches package.json
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main: releases come from main only."
            exit 1
          fi
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}."
            exit 1
          fi

  decaid-live:
    needs: tag
    # A manual run has no tag: the tag job is skipped, the checks still run.
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/decaid-live.yml
    with:
      decaid_tag: latest

  release:
    needs: decaid-live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - run: npm run release:zip

      # A manual run (workflow_dispatch) publishes nothing; keep the zip to download.
      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cafai-skin-zip
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags --depth=1
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > /tmp/notes.md
          gh release create "${GITHUB_REF_NAME}" release/*.zip \
            --title "CafAI ${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md \
            --generate-notes
